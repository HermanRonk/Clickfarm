# Altijd revalideren voor html/css/js, zodat een nieuwe deploy direct zichtbaar is
map $uri $cache_control {
    ~*\.(html|css|js)$  "no-cache";
    default             "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Bezoekersstatistieken (Umami): alleen als docker/40-umami.sh bij het starten
    # een snippet schrijft (UMAMI_HOST en UMAMI_WEBSITE_ID gezet). Anders blijft $umami_src leeg.
    set $umami_src "";
    include /etc/nginx/conf.d/umami*.snippet;

    gzip on;
    gzip_types text/css application/javascript image/x-icon;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' $umami_src; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' $umami_src; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # De beta speelt hetzelfde spel; inc/base.js herkent de beta aan het pad
    location = /beta/spel.html {
        try_files /index.html =404;
    }

    # nginx kent .xml standaard als text/xml; voor de sitemap het gangbare application/xml
    location = /sitemap.xml {
        types { }
        default_type application/xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
